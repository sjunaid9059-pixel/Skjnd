<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Firebase Merge Panel</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="orb a"></div><div class="orb b"></div>
<main class="wrap">
  <header>
    <div class="tag">FIREBASE DATA PANEL</div>
    <h1>Firebase <b>Merge</b></h1>
    <p>Enter your Firebase Realtime Database URL below.</p>
  </header>

  <section class="card">
    <div class="row title">
      <div><h2>Firebase URL</h2><span>Use the simple format shown below.</span></div>
      <button id="clear" class="outline">Clear</button>
    </div>

    <label>Database URL</label>
    <input id="url" type="text" autocomplete="off"
      placeholder="https://lodaroll-default-rtdb.firebaseio.com">

    <div class="example">Example: <code>https://lodaroll-default-rtdb.firebaseio.com</code></div>

    <div class="buttons">
      <button id="load" class="main">Load Data</button>
      <button id="share" class="light">Create Share Link</button>
    </div>

    <div id="shareBox" class="share hidden">
      <input id="shareUrl" readonly>
      <button id="copy" class="main">Copy</button>
    </div>
    <div id="msg"></div>
  </section>

  <section id="result"></section>
</main>
<script src="/app.js"></script>
</body>
</html>
